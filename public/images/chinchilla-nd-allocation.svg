<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111827; }
    .muted { fill: #6b7280; }
    .axis { stroke: #374151; stroke-width: 2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="60" y="42" font-size="22" font-weight="700">N-D plane: compute-optimal allocation</text>
  <text x="60" y="70" font-size="14" class="muted">Every point on C ~= 6ND spends the same training budget.</text>
  <line x1="130" y1="120" x2="130" y2="500" class="axis"/>
  <line x1="130" y1="500" x2="870" y2="500" class="axis"/>
  <line x1="130" y1="205" x2="870" y2="205" class="grid"/>
  <line x1="130" y1="290" x2="870" y2="290" class="grid"/>
  <line x1="130" y1="375" x2="870" y2="375" class="grid"/>
  <text x="90" y="128" font-size="14" class="muted">more D</text>
  <text x="90" y="505" font-size="14" class="muted">less D</text>
  <text x="90" y="330" font-size="15" class="muted" transform="rotate(-90 90 330)">training tokens D</text>
  <text x="130" y="530" font-size="14" class="muted">small N</text>
  <text x="500" y="530" font-size="14" class="muted" text-anchor="middle">model parameters N</text>
  <text x="870" y="530" font-size="14" class="muted" text-anchor="end">large N</text>

  <path d="M190 155 C300 185 430 255 545 325 C650 385 750 430 820 455" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="610" y="355" font-size="14" fill="#2563eb" transform="rotate(27 610 355)">C = 6ND: same budget</text>

  <path d="M190 450 L760 150" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="500" y="190" font-size="14" fill="#16a34a" transform="rotate(-28 500 190)">D ~= 20N: rule of thumb</text>

  <circle cx="365" cy="260" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <text x="382" y="253" font-size="14" font-weight="700">Chinchilla ~70B / 1.4T</text>
  <text x="382" y="273" font-size="13" class="muted">near the compute-optimal valley</text>

  <circle cx="720" cy="420" r="10" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
  <text x="510" y="448" font-size="14" font-weight="700">Gopher 280B / 300B</text>
  <text x="510" y="468" font-size="13" class="muted">large N, small D: undertrained region</text>

  <rect x="650" y="92" width="220" height="76" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <circle cx="670" cy="116" r="6" fill="#2563eb"/>
  <text x="685" y="121" font-size="13">Chinchilla point</text>
  <circle cx="670" cy="144" r="6" fill="#dc2626"/>
  <text x="685" y="149" font-size="13">Gopher comparison</text>
  <text x="60" y="575" font-size="13" class="muted">Exact FLOPs also include embeddings, attention, and logits.</text>
</svg>
