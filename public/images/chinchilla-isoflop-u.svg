<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111827; }
    .muted { fill: #6b7280; }
    .axis { stroke: #374151; stroke-width: 2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4 5; }
  </style>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="60" y="42" font-size="22" font-weight="700">IsoFLOP: U-shaped loss at fixed compute</text>
  <text x="60" y="70" font-size="14" class="muted">Sweep model size N; training tokens D follow C ~= 6ND. The valley is the optimum.</text>
  <line x1="120" y1="120" x2="120" y2="500" class="axis"/>
  <line x1="120" y1="500" x2="870" y2="500" class="axis"/>
  <line x1="120" y1="190" x2="870" y2="190" class="grid"/>
  <line x1="120" y1="275" x2="870" y2="275" class="grid"/>
  <line x1="120" y1="360" x2="870" y2="360" class="grid"/>
  <line x1="120" y1="445" x2="870" y2="445" class="grid"/>
  <text x="82" y="126" font-size="14" class="muted">high loss</text>
  <text x="82" y="505" font-size="14" class="muted">low loss</text>
  <text x="92" y="330" font-size="15" class="muted" transform="rotate(-90 92 330)">loss L</text>
  <text x="120" y="530" font-size="14" class="muted">small N</text>
  <text x="470" y="530" font-size="14" class="muted" text-anchor="middle">model size N</text>
  <text x="870" y="530" font-size="14" class="muted" text-anchor="end">large N</text>

  <path d="M145 210 C235 235 300 360 410 420 C510 455 605 340 820 175" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M145 155 C245 180 340 310 470 365 C580 395 670 260 830 125" fill="none" stroke="#16a34a" stroke-width="4"/>

  <line x1="410" y1="420" x2="410" y2="500" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="410" cy="420" r="7" fill="#2563eb"/>
  <line x1="470" y1="365" x2="470" y2="500" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="470" cy="365" r="7" fill="#16a34a"/>
  <text x="423" y="412" font-size="14" fill="#2563eb">C1 valley</text>
  <text x="483" y="357" font-size="14" fill="#16a34a">C2 valley</text>
  <text x="398" y="485" font-size="13" class="muted" text-anchor="end">smaller budget</text>
  <text x="490" y="485" font-size="13" class="muted">larger budget</text>

  <rect x="635" y="92" width="235" height="74" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="655" y1="116" x2="690" y2="116" stroke="#2563eb" stroke-width="4"/>
  <text x="700" y="121" font-size="13">C1: smaller budget</text>
  <line x1="655" y1="145" x2="690" y2="145" stroke="#16a34a" stroke-width="4"/>
  <text x="700" y="150" font-size="13">C2: larger budget</text>
  <text x="60" y="575" font-size="13" class="muted">Left: N is too small and capacity-limited. Right: N is too large and undertrained.</text>
</svg>
