<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680">
<rect width="1180" height="680" fill="#ffffff"/>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/>
  </marker>
  <style>
    .title{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:24px;font-weight:700;fill:#172033}
    .subtitle{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:13px;fill:#536174}
    .label{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:16px;font-weight:700;fill:#172033}
    .body{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:13px;fill:#536174}
    .small{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:12px;fill:#536174}
    .axis{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;font-size:13px;fill:#334155}
  </style>
</defs>
<text x="60" y="42" class="title" text-anchor="start">Confidence Tokens：训练与推理流水线</text>
<text x="60" y="68" class="subtitle" text-anchor="start">训练用真实答案标注，推理时由答案后的两个特殊 token 产生连续分数</text>
<rect x="50" y="100" width="1080" height="190" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="75" y="128" class="label" text-anchor="start">训练阶段</text>
<rect x="75" y="155" width="170" height="85" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="160" y="190" class="body" text-anchor="middle">
  <tspan x="160" dy="0px">输入样本</tspan>
  <tspan x="160" dy="20px">问题 x + 答案 y</tspan>
</text>
<rect x="285" y="155" width="190" height="85" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="380" y="190" class="body" text-anchor="middle">
  <tspan x="380" dy="0px">基础小模型</tspan>
  <tspan x="380" dy="20px">生成 ŷ</tspan>
</text>
<path d="M610 145 L700 197 L610 249 L520 197 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="610" y="192" class="body" text-anchor="middle">
  <tspan x="610" dy="0px">比较正确性</tspan>
  <tspan x="610" dy="20px">ŷ = y？</tspan>
</text>
<rect x="760" y="145" width="175" height="85" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="847" y="180" class="body" text-anchor="middle">
  <tspan x="847" dy="0px">正确答案</tspan>
  <tspan x="847" dy="20px">追加 &lt;CN&gt;</tspan>
</text>
<rect x="760" y="250" width="175" height="85" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="847" y="285" class="body" text-anchor="middle">
  <tspan x="847" dy="0px">错误答案</tspan>
  <tspan x="847" dy="20px">追加 &lt;UN&gt;</tspan>
</text>
<rect x="995" y="195" width="120" height="90" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1055" y="228" class="body" text-anchor="middle">
  <tspan x="1055" dy="0px">SFT / LoRA</tspan>
  <tspan x="1055" dy="20px">学习 token</tspan>
</text>
<path d="M245 197 H285" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M475 197 H520" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M700 197 H730 V187 H760" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M700 197 H730 V292 H760" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M935 187 H965 V240 H995" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M935 292 H965 V240 H995" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="735" y="176" class="small" text-anchor="middle">相等</text>
<text x="735" y="280" class="small" text-anchor="middle">不等</text>
<rect x="50" y="365" width="1080" height="250" rx="18" fill="#fffdf5" stroke="#e2c675" stroke-width="2" stroke-dasharray="7 5"/>
<text x="75" y="393" class="label" text-anchor="start">推理阶段</text>
<rect x="75" y="440" width="180" height="85" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="165" y="475" class="body" text-anchor="middle">
  <tspan x="165" dy="0px">新请求</tspan>
  <tspan x="165" dy="20px">只给问题 x</tspan>
</text>
<rect x="325" y="440" width="215" height="85" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
<text x="432" y="475" class="body" text-anchor="middle">
  <tspan x="432" dy="0px">小模型生成</tspan>
  <tspan x="432" dy="20px">答案 ŷ + 置信位置</tspan>
</text>
<rect x="610" y="440" width="205" height="85" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="712" y="475" class="body" text-anchor="middle">
  <tspan x="712" dy="0px">读取两个 logits</tspan>
  <tspan x="712" dy="20px">P(CN)、P(UN)</tspan>
</text>
<rect x="885" y="440" width="205" height="85" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="987" y="475" class="body" text-anchor="middle">
  <tspan x="987" dy="0px">归一化得到 c</tspan>
  <tspan x="987" dy="20px">交给路由器</tspan>
</text>
<path d="M255 482 H325" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M540 482 H610" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M815 482 H885" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1055 285 V365 H1025 V440" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
<text x="1070" y="355" class="small" text-anchor="start">训练后的模型</text>
<line x1="80" y1="650" x2="115" y2="650" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="125" y="655" class="small" text-anchor="start">数据流</text>
<line x1="235" y1="650" x2="270" y2="650" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
<text x="280" y="655" class="small" text-anchor="start">训练产物连接推理</text>
</svg>
