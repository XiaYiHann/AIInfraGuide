<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PPO DPO GRPO DAPO 算力显存账本</title>
  <desc id="desc">四种后训练算法的模型角色、在线采样和主要代价对比。</desc>
  <defs>
    <style>
      .label { font-family: "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 700; }
      .head { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .name { font-size: 32px; font-weight: 700; }
      .text { font-size: 22px; }
      .muted { font-size: 19px; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="60" y="65" class="label title">四算法账本：砍掉的角色，换回的成本</text>
  <text x="60" y="100" class="label muted">“2 份模型”是保守角色口径；rollout、KV cache 与 old-policy logprob 仍需单独计算</text>

  <rect x="50" y="135" width="1300" height="62" rx="12" fill="#334155"/>
  <text x="80" y="175" class="head">算法</text>
  <text x="260" y="175" class="head">模型角色</text>
  <text x="650" y="175" class="head">在线采样</text>
  <text x="870" y="175" class="head">奖励 / 训练信号</text>
  <text x="1190" y="175" class="head">换取</text>

  <rect x="50" y="205" width="1300" height="125" rx="10" fill="#fee2e2"/>
  <text x="80" y="258" class="label name">PPO</text>
  <text x="260" y="245" class="label text">4：policy + ref</text>
  <text x="260" y="278" class="label text">+ RM + critic</text>
  <text x="650" y="258" class="label text">每轮 rollout</text>
  <text x="870" y="245" class="label text">RM 分数 + KL</text>
  <text x="870" y="278" class="label text">critic advantage</text>
  <text x="1190" y="245" class="label text">通用探索</text>
  <text x="1190" y="278" class="label text">付出最大</text>

  <rect x="50" y="338" width="1300" height="125" rx="10" fill="#dbeafe"/>
  <text x="80" y="391" class="label name">DPO</text>
  <text x="260" y="378" class="label text">2：policy + ref</text>
  <text x="650" y="391" class="label text">否，离线偏好对</text>
  <text x="870" y="378" class="label text">chosen / rejected</text>
  <text x="870" y="411" class="label text">概率比</text>
  <text x="1190" y="378" class="label text">省 rollout</text>
  <text x="1190" y="411" class="label text">少探索</text>

  <rect x="50" y="471" width="1300" height="125" rx="10" fill="#dcfce7"/>
  <text x="80" y="524" class="label name">GRPO</text>
  <text x="260" y="511" class="label text">2：policy + ref</text>
  <text x="260" y="544" class="label text">无 critic；可无 RM</text>
  <text x="650" y="524" class="label text">每题 G 条</text>
  <text x="870" y="511" class="label text">组内 reward</text>
  <text x="870" y="544" class="label text">Â = (r − μ) / σ</text>
  <text x="1190" y="511" class="label text">省 critic</text>
  <text x="1190" y="544" class="label text">多生成</text>

  <rect x="50" y="604" width="1300" height="125" rx="10" fill="#fef3c7"/>
  <text x="80" y="657" class="label name">DAPO</text>
  <text x="260" y="644" class="label text">2 个保守角色</text>
  <text x="260" y="677" class="label text">policy + old/rollout</text>
  <text x="650" y="657" class="label text">动态补采</text>
  <text x="870" y="644" class="label text">verifier ±1</text>
  <text x="870" y="677" class="label text">四个训练技巧</text>
  <text x="1190" y="644" class="label text">规模化长 CoT</text>
  <text x="1190" y="677" class="label text">采样不固定</text>
</svg>
