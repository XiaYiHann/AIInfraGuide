<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Absolute Zero 自博弈训练循环</title>
  <desc id="desc">模型提出任务，代码环境验证任务并生成答案，模型解决任务，奖励进入 TRR++ 更新，再回到下一轮提出任务。</desc>
  <style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,SimHei,sans-serif} .title{font-size:24px;font-weight:600;fill:#111827}.label{font-size:15px;font-weight:600;fill:#111827}.sub{font-size:12px;fill:#6b7280}.edge-label{font-size:13px;fill:#374151}.note{font-size:12px;fill:#4b5563}</style>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="50" y="48" class="title">Absolute Zero：同一个模型既出题，又解题</text>
  <text x="50" y="74" class="sub">论文 Figure 3/4 的教学化重绘：环境 e 负责把任务变成可验证的 (x, y*)，而不是由人逐题打分。</text>
  <rect x="390" y="112" width="300" height="86" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="540" y="145" text-anchor="middle" class="label">πθ proposer：生成任务 τ</text>
  <text x="540" y="170" text-anchor="middle" class="sub">参考缓冲区中的 K 个历史 triplet</text>
  <rect x="755" y="252" width="270" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="890" y="286" text-anchor="middle" class="label">环境 e / checker</text>
  <text x="890" y="311" text-anchor="middle" class="sub">执行、过滤、安全检查、确定性检查</text>
  <text x="890" y="334" text-anchor="middle" class="sub">得到 (x, y*)，再验证 y</text>
  <rect x="390" y="410" width="300" height="86" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="540" y="443" text-anchor="middle" class="label">πθ solver：回答 x</text>
  <text x="540" y="468" text-anchor="middle" class="sub">生成 y，获得 rsolve ∈ {0, 1}</text>
  <rect x="70" y="252" width="270" height="104" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="205" y="286" text-anchor="middle" class="label">任务缓冲区 D</text>
  <text x="205" y="311" text-anchor="middle" class="sub">保存已验证的 (p, i, o)</text>
  <text x="205" y="334" text-anchor="middle" class="sub">供下一轮构造 z</text>
  <rect x="70" y="436" width="270" height="70" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="205" y="466" text-anchor="middle" class="label">TRR++ 联合更新</text>
  <text x="205" y="489" text-anchor="middle" class="sub">3 种任务 × 2 个角色 = 6 个基线</text>
  <path d="M690 155 L755 270" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <text x="718" y="196" class="edge-label">τ：程序 + 输入</text>
  <path d="M755 326 L690 452" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <text x="700" y="382" class="edge-label">(x, y*)：有效题</text>
  <path d="M690 454 L755 350" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
  <text x="710" y="438" class="edge-label">y：模型答案</text>
  <path d="M755 300 L730 300 L730 100 L710 100 L710 155 L690 155" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#green-arrow)"/>
  <text x="742" y="220" class="edge-label">rpropose / rsolve</text>
  <path d="M390 470 L340 470" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
  <text x="350" y="455" text-anchor="end" class="edge-label">奖励</text>
  <path d="M205 436 L205 356" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
  <text x="222" y="402" class="edge-label">写入有效任务</text>
  <path d="M340 275 C370 190 390 170 390 155" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
  <text x="300" y="210" class="edge-label">z：历史参考</text>
  <path d="M390 489 C300 570 175 570 120 506" fill="none" stroke="#9333ea" stroke-width="2.2" marker-end="url(#purple-arrow)"/>
  <text x="245" y="588" text-anchor="middle" class="edge-label">更新后回到下一轮</text>
  <g transform="translate(70,548)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/><text x="38" y="5" class="note">任务/控制流</text>
    <line x1="150" y1="0" x2="180" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)"/><text x="188" y="5" class="note">环境验证</text>
    <line x1="300" y1="0" x2="330" y2="0" stroke="#9333ea" stroke-width="2" marker-end="url(#purple-arrow)"/><text x="338" y="5" class="note">答案/反馈</text>
    <line x1="450" y1="0" x2="480" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/><text x="488" y="5" class="note">缓冲区/更新</text>
  </g>
</svg>
