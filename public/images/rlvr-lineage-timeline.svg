<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">从 SFT 到 RLVR 再到 Absolute Zero</title>
  <desc id="desc">三阶段后训练谱系：监督微调依赖人工推理轨迹，RLVR 只去掉人工轨迹但保留人工题目，Absolute Zero 让模型自己生成题目并用环境验证。</desc>
  <style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,SimHei,sans-serif}.title{font-size:24px;font-weight:600;fill:#111827}.stage{font-size:18px;font-weight:600;fill:#111827}.label{font-size:14px;font-weight:600;fill:#111827}.sub{font-size:12px;fill:#4b5563}.small{font-size:11px;fill:#6b7280}.axis{font-size:13px;font-weight:600;fill:#374151}</style>
  <defs>
    <marker id="timeline-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="50" y="45" class="title">RLVR 谱系：奖励先摆脱人工，再让题目也摆脱人工</text>
  <text x="50" y="70" class="sub">横向读：监督信号逐步从“人给轨迹”变成“环境给反馈”，但每一步都牺牲或新增一部分工程成本。</text>
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#timeline-arrow)"/>
  <circle cx="170" cy="120" r="8" fill="#2563eb"/><circle cx="570" cy="120" r="8" fill="#2563eb"/><circle cx="970" cy="120" r="8" fill="#2563eb"/>
  <text x="170" y="101" text-anchor="middle" class="axis">人工监督减少</text>
  <rect x="60" y="160" width="300" height="190" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" class="stage">SFT</text>
  <text x="210" y="222" text-anchor="middle" class="label">监督微调</text>
  <text x="85" y="258" class="sub">题目 x：人给</text>
  <text x="85" y="282" class="sub">推理轨迹 c*：人写</text>
  <text x="85" y="306" class="sub">答案 y*：人给</text>
  <text x="85" y="335" class="small">训练目标：模仿完整示范</text>
  <rect x="450" y="160" width="300" height="190" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" class="stage">RLVR</text>
  <text x="600" y="222" text-anchor="middle" class="label">可验证奖励强化学习</text>
  <text x="475" y="258" class="sub">题目 x：人给</text>
  <text x="475" y="282" class="sub">推理轨迹 c：模型自己生成</text>
  <text x="475" y="306" class="sub">奖励 r：checker 判定</text>
  <text x="475" y="335" class="small">保留人工题库与答案</text>
  <rect x="840" y="160" width="300" height="190" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="990" y="195" text-anchor="middle" class="stage">Absolute Zero</text>
  <text x="990" y="222" text-anchor="middle" class="label">零数据自博弈</text>
  <text x="865" y="258" class="sub">任务 τ：模型提出</text>
  <text x="865" y="282" class="sub">答案 y：模型解决</text>
  <text x="865" y="306" class="sub">奖励 r：环境执行验证</text>
  <text x="865" y="335" class="small">题目缓冲区在线增长</text>
  <text x="210" y="390" text-anchor="middle" class="axis">代价：人工轨迹昂贵</text>
  <text x="600" y="390" text-anchor="middle" class="axis">代价：人工题库仍是瓶颈</text>
  <text x="990" y="390" text-anchor="middle" class="axis">代价：生成 + 验证 + rollout</text>
  <line x1="90" y1="425" x2="1110" y2="425" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="600" y="451" text-anchor="middle" class="small">论文事实：Absolute Zero 的关键新增项不是“更强 checker”，而是把学习任务分布也交给 proposer 与环境共同产生。</text>
</svg>
