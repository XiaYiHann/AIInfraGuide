<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">RLHF 三阶段流水线</title>
  <desc id="desc">从人类示范到 SFT，再从人类偏好训练奖励模型，最后用 PPO 更新策略模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial,"Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:16px Arial,"Noto Sans CJK SC",sans-serif;fill:#475569}.h{font:700 22px Arial,"Noto Sans CJK SC",sans-serif;fill:#0f172a}.t{font:17px Arial,"Noto Sans CJK SC",sans-serif;fill:#1e293b}.small{font:14px Arial,"Noto Sans CJK SC",sans-serif;fill:#475569}.box{stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="50" y="48" class="title">RLHF：三段训练，不是一条单模型梯度链</text>
  <text x="50" y="78" class="sub">示意图根据 InstructGPT §3.1、§3.5 绘制；箭头表示数据与训练信号的流向。</text>

  <rect x="55" y="125" width="315" height="205" rx="18" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="80" y="165" class="h">① SFT：学会照例子做</text>
  <text x="80" y="200" class="t">人类示范</text>
  <text x="80" y="228" class="t">prompt + response</text>
  <text x="80" y="270" class="t">逐 token 最大化 logprob</text>
  <text x="80" y="305" class="small">输出：初始策略 π_SFT</text>

  <line x1="370" y1="228" x2="425" y2="228" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="440" y="125" width="315" height="205" rx="18" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="465" y="165" class="h">② RM：学会打分</text>
  <text x="465" y="200" class="t">同一 prompt 的 K 条回答</text>
  <text x="465" y="228" class="t">人类排序 → 成对偏好</text>
  <text x="465" y="270" class="t">Bradley–Terry 损失</text>
  <text x="465" y="305" class="small">输出：标量奖励 rθ(x, y)</text>

  <line x1="755" y1="228" x2="810" y2="228" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="825" y="125" width="315" height="205" rx="18" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="850" y="165" class="h">③ PPO：按奖励改策略</text>
  <text x="850" y="200" class="t">policy 在线生成 response</text>
  <text x="850" y="228" class="t">RM reward − KL 漂移惩罚</text>
  <text x="850" y="270" class="t">更新 policy 与 critic</text>
  <text x="850" y="305" class="small">输出：InstructGPT</text>

  <path d="M 980 345 C 980 390, 250 390, 250 345" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="475" y="410" class="small">PPO 产生的新回答还可以继续收集比较数据，迭代 RM 与 policy</text>
</svg>
