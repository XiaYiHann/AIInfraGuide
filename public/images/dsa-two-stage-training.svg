<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">DSA 两阶段训练配方</title>
  <desc id="desc">第一阶段保持稠密注意力，用主注意力分布监督 Lightning Indexer；第二阶段打开 top-k 稀疏注意力，主模型与 indexer 分离优化。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker>
    <style>
      .ink{stroke:#222;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#222}
      .small{font-size:18px}.body{font-size:21px}.head{font-size:27px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="500" rx="22" fill="#fffdf8"/>
  <text x="450" y="40" text-anchor="middle" class="label head">先让 indexer 学会“看哪里”，再让模型适应“少看哪里”</text>
  <rect x="28" y="70" width="406" height="390" rx="18" fill="#eaf7ff" class="ink"/>
  <rect x="466" y="70" width="406" height="390" rx="18" fill="#fff0d9" class="ink"/>
  <text x="231" y="108" text-anchor="middle" class="label head">阶段 1：Dense Warm-up</text>
  <text x="669" y="108" text-anchor="middle" class="label head">阶段 2：Sparse Training</text>
  <rect x="62" y="140" width="132" height="52" rx="12" fill="#a7eeff" class="ink"/>
  <text x="128" y="173" text-anchor="middle" class="label body">主模型 h<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <rect x="230" y="140" width="164" height="52" rx="12" fill="#d5ecda" class="ink"/>
  <text x="312" y="173" text-anchor="middle" class="label body">稠密 Attention</text>
  <path d="M194 166 L222 166" class="ink" fill="none" marker-end="url(#arrow)"/>
  <rect x="112" y="235" width="168" height="58" rx="12" fill="#f5f5ce" class="ink"/>
  <text x="196" y="271" text-anchor="middle" class="label body">教师分布 p_t</text>
  <rect x="302" y="235" width="96" height="58" rx="12" fill="#f9c8c8" class="ink"/>
  <text x="350" y="271" text-anchor="middle" class="label body">KL</text>
  <path d="M312 192 L245 235" class="ink" fill="none" marker-end="url(#arrow)"/>
  <path d="M312 192 L350 235" class="ink" fill="none" marker-end="url(#arrow)"/>
  <text x="231" y="340" text-anchor="middle" class="label body">只更新 Lightning Indexer</text>
  <text x="231" y="374" text-anchor="middle" class="label small">冻结主模型；1000 steps；约 2.1B tokens</text>
  <text x="231" y="410" text-anchor="middle" class="label small">目标：让 indexer 分布贴近主注意力</text>
  <rect x="500" y="140" width="132" height="52" rx="12" fill="#a7eeff" class="ink"/>
  <text x="566" y="173" text-anchor="middle" class="label body">h<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <rect x="668" y="140" width="164" height="52" rx="12" fill="#f5f5ce" class="ink"/>
  <text x="750" y="173" text-anchor="middle" class="label body">Indexer + top-k</text>
  <path d="M632 166 L660 166" class="ink" fill="none" marker-end="url(#arrow)"/>
  <rect x="512" y="235" width="146" height="58" rx="12" fill="#d5ecda" class="ink"/>
  <text x="585" y="271" text-anchor="middle" class="label body">稀疏 Attn</text>
  <rect x="676" y="235" width="122" height="58" rx="12" fill="#f9c8c8" class="ink"/>
  <text x="737" y="271" text-anchor="middle" class="label body">KL（S_t）</text>
  <path d="M750 192 L585 235" class="ink" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 192 L737 235" class="ink" fill="none" marker-end="url(#arrow)"/>
  <rect x="530" y="335" width="126" height="54" rx="12" fill="#b8e6c1" class="ink"/>
  <text x="593" y="369" text-anchor="middle" class="label body">LM Loss</text>
  <rect x="672" y="335" width="148" height="54" rx="12" fill="#ffe8b8" class="ink"/>
  <text x="746" y="369" text-anchor="middle" class="label body">detach 输入</text>
  <path d="M585 293 L593 327" class="ink" fill="none" marker-end="url(#arrow)"/>
  <path d="M737 293 L746 327" class="ink" fill="none" marker-end="url(#arrow)"/>
  <text x="669" y="420" text-anchor="middle" class="label small">主模型只收 LM 梯度；indexer 只收 KL 梯度</text>
  <text x="669" y="446" text-anchor="middle" class="label small">15,000 steps；943.7B tokens；k=2048</text>
</svg>
